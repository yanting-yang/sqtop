# Pushing a version tag (`git push origin v0.2.1`) builds sqtop, publishes it
# to PyPI and creates the GitHub release with the built files. The tag must
# match the version in pyproject.toml. The tag message's body (the lines after
# its first) becomes the release notes, followed by GitHub's list of changes.
#
# PyPI takes the upload through trusted publishing, with no token: the
# project's publisher on pypi.org names this repository, this workflow file
# (release.yml) and the `pypi` environment.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write # the GitHub release
      id-token: write # trusted publishing to PyPI
    steps:
      # Pinned by commit, since this job can publish.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Check the tag matches pyproject.toml
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: uv build

      # --check-url skips files PyPI already has, so a failed run can be rerun.
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # actions/checkout fetches the tag without its message; fetch it whole.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "sqtop $VERSION" --notes-file notes.md --generate-notes
