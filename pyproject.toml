[project]
name = "sqtop"
version = "0.2.0"
description = "Slurm dashboard: partitions, account/QOS limits and estimated start times"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.13.*"
keywords = ["slurm", "hpc", "tui", "dashboard", "squeue", "sbatch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Clustering",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "textual>=8,<9",
]

[project.urls]
Homepage = "https://github.com/yanting-yang/sqtop"
Issues = "https://github.com/yanting-yang/sqtop/issues"

[project.scripts]
sqtop = "sqtop.cli:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sqtop"
